services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_reservas
    restart: always
    environment:
      POSTGRES_DB: reservasdb
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d reservasdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  reservas-api:
    build: .
    container_name: reservas_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      PORT: 8083
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: reservasdb
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DDL_AUTO: update
      SHOW_SQL: "false"

volumes:
  postgres_data: