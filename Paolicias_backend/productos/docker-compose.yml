services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_productos
    restart: always
    environment:
      POSTGRES_DB: productosdb
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d productosdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  productos-api:
    build: .
    container_name: productos_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: productosdb
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DDL_AUTO: update
      SHOW_SQL: "false"

volumes:
  postgres_data: